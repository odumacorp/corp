{% extends '_partials/base.html' %}
{% load static %}

{% block title %}Send Message | Oduma Connect{% endblock %}

{% block content %}
<div class="oc-container" style="max-width:600px;padding-top:48px;padding-bottom:64px;">
  <div class="oc-card" style="padding:32px;">
    <h2 style="font-size:1.25rem;font-weight:700;color:var(--oc-text-primary);margin-bottom:4px;">
      Send a Message
    </h2>
    <p style="font-size:.875rem;color:var(--oc-text-muted);margin-bottom:24px;">
      To <strong>{{ recipient.get_full_name|default:recipient.username }}</strong>
    </p>

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:16px;">
        <textarea name="content" rows="6" placeholder="Write your message…"
          style="width:100%;padding:12px 14px;border:1.5px solid var(--oc-border);border-radius:var(--oc-radius-md);
                 font-size:.9rem;font-family:inherit;resize:vertical;outline:none;transition:border-color .2s;"
          onfocus="this.style.borderColor='var(--oc-primary)'" onblur="this.style.borderColor='var(--oc-border)'"></textarea>
      </div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="oc-btn oc-btn-primary" style="flex:1;">Send Message</button>
        <button type="button" class="oc-btn oc-btn-outline" onclick="window.history.back();">Cancel</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
