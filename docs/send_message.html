{% extends '_partials/base.html' %}
{% load static %}

{% block title %}Send Message | Oduma Corp{% endblock %}

{% block content %}
<button onclick="history.back()" class="oc-back-btn">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  Back
</button>
<div class="oc-container" style="max-width:600px;padding-top:48px;padding-bottom:64px;">
  <div class="oc-card" style="padding:32px;">
    <h2 style="font-size: 1.7rem;font-weight:700;color:var(--oc-text-primary);margin-bottom:4px;">
      Send a Message
    </h2>
    <p style="font-size: 1.2rem;color:var(--oc-text-muted);margin-bottom:24px;">
      To <strong>{{ recipient.get_full_name|default:recipient.username }}</strong>
    </p>

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:16px;">
        <textarea name="content" rows="6" placeholder="Write your message…"
          style="width:100%;padding:12px 14px;border:1.5px solid var(--oc-border);border-radius:var(--oc-radius-md);
                 font-size: 1.2rem;font-family:inherit;resize:vertical;outline:none;transition:border-color .2s;"
          onfocus="this.style.borderColor='var(--oc-primary)'" onblur="this.style.borderColor='var(--oc-border)'"></textarea>
      </div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="oc-btn oc-btn-primary" style="flex:1;">Send Message</button>
        <button type="button" class="oc-btn oc-btn-outline" onclick="window.history.back();">Cancel</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
