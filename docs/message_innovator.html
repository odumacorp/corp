{% extends '_partials/base.html' %}
{% block content %}
<button onclick="history.back()" class="oc-back-btn">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  Back
</button>
<div class="container mt-4">
    <h3>Message {{ recipient.get_full_name|default:recipient.username }}</h3>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="message" class="form-label">Your Message</label>
            <textarea class="form-control" name="message" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
        <a href="{% url 'innovators' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
