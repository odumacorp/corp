{% load static %}
<link rel="preload" href="{% static 'fonts/dm-sans-latin-var.woff2' %}" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"DM Sans";src:url({% static 'fonts/dm-sans-latin-var.woff2' %}) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
.dir{--blue:#004AAD;--deep:#003A8C;--tint:#E1EAF7;--warm:#F29D38;--warm-tint:#FCEBD5;--ink:#0F1B33;--body:#4A5568;--muted:#5B6475;--line:#E2E6EE;--paper:#FBFAF7;--ok:#0E5C34;
  --shadow:0 1px 2px rgba(15,27,51,.05),0 6px 20px rgba(15,27,51,.06);--shadow-up:0 2px 4px rgba(15,27,51,.06),0 16px 36px rgba(15,27,51,.12);
  font:400 16px/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--body);-webkit-font-smoothing:antialiased;padding-bottom:56px}
.dir *,.dir *::before,.dir *::after{box-sizing:border-box}
.dir a{color:inherit}
.dir :focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.dir-wrap{max-width:1200px;margin:0 auto;padding:0 20px}
@media (max-width:480px){.dir-wrap{padding:0 16px}}

/* hero */
.dir-hero{background:linear-gradient(160deg,#EEF3FC 0%,#F5F2EC 60%,#FCEBD5 100%);border-bottom:1px solid rgba(15,27,51,.06);padding:36px 0 30px}
.dir-eyebrow{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--deep);margin-bottom:8px}
.dir-hero h1{margin:0 0 8px;color:var(--ink);font:700 clamp(30px,3vw + 16px,44px)/1.08 inherit;font-family:inherit;letter-spacing:-.03em}
.dir-hero p{margin:0 0 20px;font-size:17px;max-width:38em;color:#3D475A}
.dir-search{display:flex;gap:10px;max-width:640px}
.dir-search label{position:relative;flex:1;min-width:0}
.dir-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#7A8599;pointer-events:none}
.dir .dir-search input{width:100%;height:50px;padding:0 14px 0 42px;border:1px solid #CFD7E4;border-radius:999px;background:#fff;color:var(--ink);font-family:inherit;font-size:16px;box-shadow:var(--shadow)}
.dir .dir-search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,74,173,.18)}
.dir-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;font-family:inherit;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,transform .2s,color .2s}
.dir .dir-btn--solid{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(0,74,173,.25)}
.dir-btn--solid:hover{background:var(--deep);color:#fff;transform:translateY(-1px)}
.dir .dir-btn--ghost{background:#fff;border-color:#CBD3E1;color:var(--ink)}
.dir-btn--ghost:hover{border-color:var(--blue);color:var(--deep)}
.dir .dir-btn--quiet{background:transparent;border-color:#F0C9C9;color:#9B1C1C}
.dir-btn--quiet:hover{border-color:#9B1C1C}
.dir-search .dir-btn{height:50px;padding:0 24px}

/* chips */
.dir-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:26px 0 18px}
.dir-count{margin:0;font-size:15px;color:var(--muted)}
.dir-count b{color:var(--ink)}
.dir-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px 6px;-webkit-overflow-scrolling:touch}
.dir-chips::-webkit-scrollbar{display:none}
.dir-chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14.5px;font-weight:600;text-decoration:none;transition:border-color .2s,background .2s}
.dir-chip:hover{border-color:var(--blue)}
.dir-chip small{font-size:12.5px;font-weight:700;color:var(--muted);background:#F1F4F9;border-radius:999px;padding:1px 8px}
.dir-chip[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.dir-chip[aria-current="true"] small{background:rgba(255,255,255,.22);color:#fff}

/* cards */
.dir-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:1024px){.dir-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.dir-grid{grid-template-columns:minmax(0,1fr)}}
.dir-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;transition:transform .25s,box-shadow .25s}
.dir-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}
.dir-cover{position:relative;height:118px;background:linear-gradient(135deg,#DCE6F7,#C9D8F2);overflow:hidden}
.dir-cover img{width:100%;height:100%;object-fit:cover;display:block}
.dir-cover .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(0,58,140,.35)}
.dir-head{display:flex;gap:12px;align-items:flex-end;padding:0 18px;margin-top:-30px;position:relative}
.dir-av{position:relative;flex:none;width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;overflow:hidden;box-shadow:0 4px 12px rgba(15,27,51,.18)}
.dir-av img{width:100%;height:100%;object-fit:cover}
.dir-who{min-width:0;padding-bottom:2px}
.dir-name{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:17.5px;font-weight:700;line-height:1.25}
.dir-name a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir-name a:hover{color:var(--deep);text-decoration:underline}
.dir-name .ok{flex:none;width:18px;height:18px;color:var(--blue)}
.dir-company{margin:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir-body{padding:12px 18px 0;flex:1;display:flex;flex-direction:column}
.dir-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dir-tag{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--tint);color:var(--deep)}
.dir-bio{margin:0 0 12px;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dir-proj{display:block;margin-top:auto;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);text-decoration:none}
.dir-proj:hover{border-color:#B9C8E3}
.dir-proj small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dir-proj b{display:block;color:var(--ink);font-size:15.5px;margin:2px 0}
.dir-proj span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.dir-noproj{margin-top:auto;padding:12px 14px;border:1.5px dashed var(--line);border-radius:14px;font-size:14px;color:var(--muted)}
.dir-engage{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 0}
.dir-like{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.dir-like:hover,.dir-like.liked{border-color:#E7A1A1;color:#B42318;background:#FFF6F6}
.dir-stars{display:inline-flex;gap:0;flex:none}
.dir .dir-star{flex:none;width:30px;min-width:0;height:30px;margin:0;border:0;background:none;box-shadow:none;padding:0;font-size:20px;line-height:1;color:#D4DAE5;cursor:pointer}
.dir .dir-star.on{color:#F29D38}
.dir-acts{display:flex;gap:8px;padding:14px 18px 18px}
.dir-acts form{display:flex;flex:1;margin:0}
.dir-acts .dir-btn{flex:1;min-height:42px;padding:0 12px;font-size:14.5px}
.dir-acts .icon{flex:0 0 44px;padding:0}
.dir-acts .icon svg{width:18px;height:18px}
.dir-empty{padding:40px 22px;border:1.5px dashed #C3CDE0;border-radius:20px;text-align:center;color:var(--muted)}
.dir-empty h2{margin:0 0 6px;color:var(--ink);font-size:20px}
@media (prefers-reduced-motion:reduce){.dir *{transition:none!important}}
</style>
<style>
/* shared extras for investors / companies */
.dir-logo{border-radius:18px!important;background:linear-gradient(135deg,#0A5AC4,#004AAD)!important}
.dir-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 12px;font-size:14px;color:var(--muted)}
.dir-meta b{color:var(--ink)}
.dir-tag--ok{background:#DDF3E6;color:var(--ok)}
.dir-bar-r{display:flex;align-items:center;gap:8px}
.dir-sort{display:inline-flex;gap:4px;padding:4px;background:#EBEFF5;border:1px solid var(--line);border-radius:999px}
.dir-sort a{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);text-decoration:none}
.dir-sort a[aria-current="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,27,51,.12)}
.dir-tabs{display:inline-flex;gap:4px;padding:5px;margin:22px 0 0;background:#EBEFF5;border:1px solid var(--line);border-radius:999px}
.dir .dir-tab{min-width:0;min-height:42px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:none;transform:none}
.dir .dir-tab[aria-selected="true"]{background:var(--blue);color:#fff}
.dir-tab small{margin-left:6px;font-size:12.5px;padding:1px 8px;border-radius:999px;background:rgba(15,27,51,.08)}
.dir-tab[aria-selected="true"] small{background:rgba(255,255,255,.22)}
.dir-hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.dir-hero-row .dir-btn{flex:none}
.dir .dir-btn--saved{background:var(--tint);border-color:var(--blue);color:var(--deep)}
</style>
<style>
.dir-card--flat{padding-top:18px}
.dir-head--flat{margin-top:0;align-items:center}
.dir-company a{color:var(--deep);text-decoration:none}
.dir-company a:hover{text-decoration:underline}
.dir .dir-date{flex-direction:column;gap:0;background:#fff;color:var(--ink);border-radius:16px;line-height:1}
.dir-date b{font-size:22px}
.dir-date small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#B45309;margin-top:2px}
.dir .dir-date{display:flex;align-items:center;justify-content:center}
.dir-flag{position:absolute;top:12px;right:12px;padding:3px 10px;border-radius:999px;background:#fff;color:#9A4A00;font-size:12px;font-weight:700}
</style>
<style>
.dir-sh{display:flex;align-items:center;gap:10px;margin:30px 0 14px;color:var(--ink);font-size:20px;font-weight:700;letter-spacing:-.01em}
.dir-sh small{font-size:13px;font-weight:700;color:var(--muted);background:#EBEFF5;border-radius:999px;padding:2px 10px}
.dir-sh a{margin-left:auto;font-size:14.5px;font-weight:700;color:var(--blue);text-decoration:none}
.dir-sh a:hover{text-decoration:underline}
.dir-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dir-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.dir-row form{margin:0}
.dir-row .dir-btn{min-height:40px;padding:0 16px;font-size:14.5px}
.dir-row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.dir-row-main b{color:var(--ink);font-size:16px}
.dir-row-main span{font-size:14px;color:var(--muted)}
.dir-row-main a{color:var(--deep)}
.dir .dir-av--sm{width:46px;height:46px;font-size:17px;border-width:0;box-shadow:none}
@media (max-width:560px){.dir-row{flex-wrap:wrap}.dir-row-main{flex-basis:calc(100% - 60px)}.dir-row form{flex:1}.dir-row form .dir-btn{width:100%}}
</style>
