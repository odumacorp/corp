{% extends '_partials/base.html' %}
{% block content%}
<nav class="oc-breadcrumbs" aria-label="Breadcrumb">
  <ol class="oc-breadcrumbs__list">
    <li class="oc-breadcrumbs__item"><a href="{% url 'index' %}" class="oc-breadcrumbs__link">Home</a><span class="oc-breadcrumbs__sep">›</span></li>
    <li class="oc-breadcrumbs__item"><a href="{% url 'inbox' %}" class="oc-breadcrumbs__link">Messages</a><span class="oc-breadcrumbs__sep">›</span></li>
    <li class="oc-breadcrumbs__item"><span class="oc-breadcrumbs__current">Sent</span></li>
  </ol>
</nav>
<!-- <h2>Sent Messages</h2> -->
<ul>
  {% for msg in messages %}
    <li>
      <strong>To:</strong> {{ msg.recipient.username }}<br>
      <strong>Message:</strong> {{ msg.content }}<br>
      <small>{{ msg.timestamp }}</small>
    </li>
  {% empty %}
    <li>No sent messages.</li>
  {% endfor %}
</ul>
<button class="btn btn-secondary my-3" onclick="window.history.back();">
    ← Go Back
</button>
{% endblock%}
