<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oduma Corp — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1B5EC7;
      --blue-lt: #4d8ef0;
      --blue-glow: rgba(27,94,199,0.4);
      --ink: #070E1C;
      --card: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.07);
      --text: #EDF1F9;
      --muted: rgba(237,241,249,0.42);
      --done: rgba(237,241,249,0.6);
    }

    html, body { height: 100%; background: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; color: var(--text); overflow: hidden; }

    /* ── Background orbs ── */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.55;
      animation: orb-drift 12s ease-in-out infinite alternate;
    }
    .bg-orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(27,94,199,0.5) 0%, transparent 70%); top: -200px; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
    .bg-orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(27,94,199,0.3) 0%, transparent 70%); bottom: -100px; right: -100px; animation-delay: -4s; }
    .bg-orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(77,142,240,0.25) 0%, transparent 70%); bottom: 20%; left: -80px; animation-delay: -8s; }

    /* Grid overlay */
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(27,94,199,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(27,94,199,0.05) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
    }

    /* ── Stage ── */
    .stage {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 20px 80px;
    }

    /* ── Glass card ── */
    .card {
      width: 100%; max-width: 400px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 36px 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex; flex-direction: column; align-items: center;
      animation: fadeUp 0.6s ease both;
    }

    /* ── Logo ── */
    .logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 36px; }
    .logo-img {
      width: 72px; height: 72px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 8px 32px rgba(27,94,199,0.45);
    }
    .logo-text { text-align: center; }
    .logo-name { font-size: 1.6rem; font-weight: 700; color: var(--text); letter-spacing: -0.4px; }
    .logo-tag  { font-size: 1.05rem; font-weight: 500; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }

    /* ── Orbital spinner ── */
    .spinner-wrap {
      position: relative; width: 96px; height: 96px;
      margin-bottom: 28px;
    }
    /* Glow base */
    .spinner-glow {
      position: absolute; inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(27,94,199,0.2) 0%, transparent 70%);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    /* Ring 1 – outer */
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid transparent;
    }
    .ring-1 {
      border-top-color: var(--blue-lt);
      border-right-color: rgba(77,142,240,0.2);
      animation: spin 2s linear infinite;
    }
    /* Ring 2 – mid */
    .ring-2 {
      inset: 12px;
      border-bottom-color: var(--blue);
      border-left-color: rgba(27,94,199,0.25);
      animation: spin 1.4s linear infinite reverse;
    }
    /* Ring 3 – inner */
    .ring-3 {
      inset: 26px;
      border-top-color: rgba(77,142,240,0.7);
      border-right-color: transparent;
      animation: spin 0.9s linear infinite;
    }
    /* Center dot */
    .ring-center {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .ring-center::after {
      content: '';
      width: 10px; height: 10px;
      background: var(--blue);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(27,94,199,0.9), 0 0 32px rgba(27,94,199,0.4);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    /* ── Text ── */
    .headline {
      font-size: 1.55rem; font-weight: 700; color: var(--text); letter-spacing: -0.3px;
      text-align: center; margin-bottom: 6px;
    }
    .subline {
      font-size: 1.2rem; font-weight: 400; color: var(--muted);
      text-align: center; margin-bottom: 28px;
    }

    /* ── Progress ── */
    .progress-wrap { width: 100%; margin-bottom: 24px; }
    .progress-track {
      height: 5px; background: rgba(255,255,255,0.07);
      border-radius: 99px; overflow: hidden; position: relative;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--blue) 0%, var(--blue-lt) 100%);
      border-radius: 99px;
      box-shadow: 0 0 12px var(--blue-glow);
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
      position: relative;
    }
    /* Shimmer on progress fill */
    .progress-fill::after {
      content: '';
      position: absolute; top: 0; right: 0; bottom: 0; width: 60px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 1.5s ease-in-out infinite;
    }
    .progress-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px;
    }
    .progress-status { font-size: 1.15rem; font-weight: 500; color: var(--muted); }
    .progress-pct    { font-size: 1.15rem; font-weight: 700; color: var(--blue-lt); font-variant-numeric: tabular-nums; }

    /* ── Steps ── */
    .steps { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .step {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 9px;
      font-size: 1.15rem; font-weight: 500; color: rgba(237,241,249,0.3);
      opacity: 0; transform: translateX(-8px);
      transition: opacity 0.35s ease, transform 0.35s ease, background 0.3s, color 0.3s;
    }
    .step.visible {
      opacity: 1; transform: none;
      color: var(--text); background: rgba(27,94,199,0.1);
    }
    .step.done {
      color: var(--done); background: transparent;
    }
    /* Step icon */
    .step-icon { width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .step-icon .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .step.visible .dot { background: var(--blue-lt); box-shadow: 0 0 8px var(--blue-glow); }
    .step.done .dot { display: none; }
    .step-check {
      display: none;
      width: 14px; height: 14px;
    }
    .step.done .step-check { display: block; }

    /* ── Bottom ── */
    .bottom-note {
      position: absolute; bottom: 28px; left: 0; right: 0;
      text-align: center; font-size: 1.1rem; color: rgba(237,241,249,0.28);
      animation: fadeUp 0.6s 0.9s ease both; opacity: 0;
    }
    .bottom-note.show { opacity: 1; }
    .bottom-note a { color: rgba(77,142,240,0.6); text-decoration: none; transition: color 0.2s; }
    .bottom-note a:hover { color: var(--blue-lt); }

    /* ── Keyframes ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes orb-drift { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(30px); } }
    @keyframes pulse-glow { 0%,100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes pulse-dot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.6); opacity: 0.4; } }
    @keyframes shimmer { from { transform: translateX(-100px); } to { transform: translateX(200px); } }

    @media (max-width: 440px) {
      .card { padding: 32px 24px 28px; }
      .headline { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
</div>

<div class="stage">
  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="logo.png" alt="Oduma Corp" class="logo-img">
      <div class="logo-text">
        <div class="logo-name">Oduma Corp</div>
        <div class="logo-tag">Africa's Innovation Platform</div>
      </div>
    </div>

    <!-- Spinner -->
    <div class="spinner-wrap">
      <div class="spinner-glow"></div>
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ring-center"></div>
    </div>

    <!-- Text -->
    <h1 class="headline">Getting things ready</h1>
    <p class="subline">Waking up the platform&hellip;</p>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="prog-fill"></div>
      </div>
      <div class="progress-meta">
        <span class="progress-status" id="prog-status">Starting up</span>
        <span class="progress-pct" id="prog-pct">0%</span>
      </div>
    </div>

    <!-- Steps -->
    <div class="steps" id="steps">
      <div class="step">
        <div class="step-icon">
          <div class="dot"></div>
          <svg class="step-check" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" fill="rgba(27,94,199,0.2)" stroke="rgba(27,94,199,0.4)"/><path d="M4 7l2 2 4-4" stroke="#4d8ef0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span>Incoming request received</span>
      </div>
      <div class="step">
        <div class="step-icon">
          <div class="dot"></div>
          <svg class="step-check" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" fill="rgba(27,94,199,0.2)" stroke="rgba(27,94,199,0.4)"/><path d="M4 7l2 2 4-4" stroke="#4d8ef0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span>Service waking up</span>
      </div>
      <div class="step">
        <div class="step-icon">
          <div class="dot"></div>
          <svg class="step-check" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" fill="rgba(27,94,199,0.2)" stroke="rgba(27,94,199,0.4)"/><path d="M4 7l2 2 4-4" stroke="#4d8ef0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span>Allocating resources</span>
      </div>
      <div class="step">
        <div class="step-icon">
          <div class="dot"></div>
          <svg class="step-check" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" fill="rgba(27,94,199,0.2)" stroke="rgba(27,94,199,0.4)"/><path d="M4 7l2 2 4-4" stroke="#4d8ef0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span>Loading application</span>
      </div>
      <div class="step">
        <div class="step-icon">
          <div class="dot"></div>
          <svg class="step-check" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" fill="rgba(27,94,199,0.2)" stroke="rgba(27,94,199,0.4)"/><path d="M4 7l2 2 4-4" stroke="#4d8ef0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span>Almost there</span>
      </div>
    </div>

  </div><!-- /card -->
</div>

<p class="bottom-note" id="bottom-note">
  Refreshing automatically &mdash; <a href="javascript:location.reload()">reload now</a>
</p>

<script>
  const fill   = document.getElementById('prog-fill');
  const status = document.getElementById('prog-status');
  const pct    = document.getElementById('prog-pct');
  const steps  = Array.from(document.querySelectorAll('.step'));
  const note   = document.getElementById('bottom-note');

  // Show bottom note after brief delay
  setTimeout(() => note.classList.add('show'), 1200);

  const stages = [
    { p: 10, label: 'Starting up',           delay: 400   },
    { p: 28, label: 'Service waking up',      delay: 1800  },
    { p: 52, label: 'Allocating resources',   delay: 3800  },
    { p: 74, label: 'Loading application',    delay: 6200  },
    { p: 91, label: 'Almost there',           delay: 9000  },
    { p: 99, label: 'Finalizing…',            delay: 11800 },
  ];

  stages.forEach(({ p, label, delay }, i) => {
    setTimeout(() => {
      fill.style.width = p + '%';
      status.textContent = label;
      pct.textContent = p + '%';
      // Mark previous done, show current
      if (i > 0) steps[i - 1].classList.replace('visible', 'done');
      if (i < steps.length) steps[i].classList.add('visible');
    }, delay);
  });

  setTimeout(() => {
    if (steps[steps.length - 1].classList.contains('visible'))
      steps[steps.length - 1].classList.replace('visible', 'done');
    fill.style.width = '100%';
    pct.textContent = '100%';
    status.textContent = 'Done';
  }, 14000);

  // Reload every 15s; also on tab refocus
  let reloadTimer = setTimeout(() => location.reload(), 15000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { clearTimeout(reloadTimer); location.reload(); }
  });
</script>
</body>
</html>
