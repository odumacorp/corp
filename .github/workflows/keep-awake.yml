name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:        # allows manual run

concurrency:
  group: keep-awake
  cancel-in-progress: false   # let running pings finish, skip the queued duplicate

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Django app (wakes Render service)
        run: curl -s https://connect-ihni.onrender.com > /dev/null
